# KServe injects two containers into a predictor pod to mount the model image: "modelcar-init" and "modelcar". They
# come without the settings Pod Security "restricted" requires, so the namespace rejected every predictor pod. Rather
# than weaken the namespace to "baseline", this mutation hardens every pod in serving: pod-level runAsNonRoot is set
# and a RuntimeDefault seccomp profile added when there is none, and every container is set to
# allowPrivilegeEscalation: false with all capabilities dropped. Those values are exactly what "restricted" requires,
# so setting them can only tighten a pod. Mutating admission runs before Pod Security is checked, so the hardened pod
# is what gets validated.
# A MutatingPolicy: Kyverno's CEL policy type, which replaced ClusterPolicy's mutate rules in Kyverno 1.20. The pod's
# settings are apply configurations; the containers' are JSON patches, as an apply configuration may not set an atomic
# list such as capabilities.drop. A container's other capabilities settings (add) are kept.
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: harden-serving-pods
  annotations:
    policies.kyverno.io/title: Restricted security settings for every container in serving
spec:
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  matchConditions:
    - name: in-serving
      expression: request.namespace == 'serving'
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{spec: Object.spec{securityContext: Object.spec.securityContext{runAsNonRoot: true}}}
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          has(object.spec.securityContext) && has(object.spec.securityContext.seccompProfile) ? Object{} :
          Object{spec: Object.spec{securityContext: Object.spec.securityContext{
            seccompProfile: Object.spec.securityContext.seccompProfile{type: "RuntimeDefault"}}}}
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          lists.range(size(object.spec.containers)).map(i,
            !has(object.spec.containers[i].securityContext) ?
              [JSONPatch{op: "add", path: "/spec/containers/" + string(i) + "/securityContext",
                value: {"allowPrivilegeEscalation": dyn(false), "capabilities": dyn({"drop": ["ALL"]})}}] :
              [JSONPatch{op: "add", path: "/spec/containers/" + string(i) + "/securityContext" + "/allowPrivilegeEscalation", value: false},
               !has(object.spec.containers[i].securityContext.capabilities) ?
                 JSONPatch{op: "add", path: "/spec/containers/" + string(i) + "/securityContext" + "/capabilities", value: {"drop": ["ALL"]}} :
                 JSONPatch{op: "add", path: "/spec/containers/" + string(i) + "/securityContext" + "/capabilities/drop", value: ["ALL"]}]
          ).flatten()
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          !has(object.spec.initContainers) ? [] : lists.range(size(object.spec.initContainers)).map(i,
            !has(object.spec.initContainers[i].securityContext) ?
              [JSONPatch{op: "add", path: "/spec/initContainers/" + string(i) + "/securityContext",
                value: {"allowPrivilegeEscalation": dyn(false), "capabilities": dyn({"drop": ["ALL"]})}}] :
              [JSONPatch{op: "add", path: "/spec/initContainers/" + string(i) + "/securityContext" + "/allowPrivilegeEscalation", value: false},
               !has(object.spec.initContainers[i].securityContext.capabilities) ?
                 JSONPatch{op: "add", path: "/spec/initContainers/" + string(i) + "/securityContext" + "/capabilities", value: {"drop": ["ALL"]}} :
                 JSONPatch{op: "add", path: "/spec/initContainers/" + string(i) + "/securityContext" + "/capabilities/drop", value: ["ALL"]}]
          ).flatten()
