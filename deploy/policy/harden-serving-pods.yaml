# KServe injects two containers into a predictor pod to mount the model image: "modelcar-init" and "modelcar". They
# come without the settings Pod Security "restricted" requires, so the namespace rejected every predictor pod. Rather
# than weaken the namespace to "baseline", this mutation hardens every pod in serving: pod-level runAsNonRoot and
# seccomp are added when absent, and every container is set to allowPrivilegeEscalation: false with all capabilities
# dropped. Those two values are exactly what "restricted" requires, so setting them can only tighten a container.
# Mutating admission runs before Pod Security is checked, so the hardened pod is what gets validated.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: harden-serving-pods
  annotations:
    policies.kyverno.io/title: Restricted security settings for every container in serving
spec:
  background: false
  rules:
    # Kyverno allows only one of foreach / patchStrategicMerge per mutate rule (enforced by the cluster's policy
    # validation, not by the offline CLI), so pod-level and per-container settings are two rules.
    - name: restricted-pod-defaults
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["serving"]
      mutate:
        patchStrategicMerge:
          spec:
            securityContext:
              +(runAsNonRoot): true
              +(seccompProfile):
                type: RuntimeDefault
    - name: restricted-container-defaults
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["serving"]
      mutate:
        foreach:
          - list: "request.object.spec.containers"
            patchStrategicMerge:
              spec:
                containers:
                  - name: "{{ element.name }}"
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: ["ALL"]
          - list: "request.object.spec.initContainers || `[]`"
            patchStrategicMerge:
              spec:
                initContainers:
                  - name: "{{ element.name }}"
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: ["ALL"]
