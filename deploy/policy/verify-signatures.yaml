# Gate G6, threat T7: in the serving namespace, every image must carry a cosign signature from the pipeline's key.
# That covers the server image and the model image (KServe runs the model as a "modelcar" container), so a model
# that was not built and signed by the pipeline never starts. The public key is read from the Secret
# kyverno/smlops-signing-key (key cosign.pub), created by scripts/install-platform.sh; the transparency log is not
# used for this local key, so no public record is written. Admission fails closed: if Kyverno cannot verify, the
# pod is rejected.
# Gate G5: each image must also carry a SLSA v1 provenance attestation, signed with the same key, saying it came
# from this repository's publish step (scripts/publish-model.sh, smlops provenance). A signature says who published
# an image; the attestation says what it was built from, and an image signed by hand without it is rejected.
# Model images also need their CycloneDX ML-BOM attested: what the model contains, with its datasets by fingerprint.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-model-signatures
  annotations:
    policies.kyverno.io/title: Signed images only in serving
    policies.kyverno.io/severity: high
spec:
  background: false
  webhookTimeoutSeconds: 30
  failurePolicy: Fail
  rules:
    - name: signed-by-the-pipeline
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["serving"]
      verifyImages:
        - imageReferences: ["*"]
          failureAction: Enforce
          required: true
          verifyDigest: true
          mutateDigest: false
          attestors:
            - entries:
                - keys:
                    secret:
                      name: smlops-signing-key
                      namespace: kyverno
                    rekor:
                      ignoreTlog: true
                    ctlog:
                      ignoreSCT: true
          attestations:
            - type: https://slsa.dev/provenance/v1
              attestors:
                - entries:
                    - keys:
                        secret:
                          name: smlops-signing-key
                          namespace: kyverno
                        rekor:
                          ignoreTlog: true
                        ctlog:
                          ignoreSCT: true
              conditions:
                - all:
                    - key: "{{ buildDefinition.buildType }}"
                      operator: Equals
                      value: https://github.com/sunilmehta-si/kubernetes-secure-mlops-pipeline/publish-model@v1
                    - key: "{{ length(buildDefinition.resolvedDependencies) }}"
                      operator: GreaterThanOrEquals
                      value: 2
        - imageReferences: ["kind-registry:5000/ticket-router*"]       # the model images
          failureAction: Enforce
          required: true
          verifyDigest: true
          mutateDigest: false
          attestations:
            - type: https://cyclonedx.org/bom
              attestors:
                - entries:
                    - keys:
                        secret:
                          name: smlops-signing-key
                          namespace: kyverno
                        rekor:
                          ignoreTlog: true
                        ctlog:
                          ignoreSCT: true
              conditions:
                - all:
                    - key: "{{ metadata.component.type }}"
                      operator: Equals
                      value: machine-learning-model
