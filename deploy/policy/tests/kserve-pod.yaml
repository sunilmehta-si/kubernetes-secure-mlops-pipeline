# A predictor pod as KServe creates it: our server container is hardened, the injected modelcar containers are not.
apiVersion: v1
kind: Pod
metadata: {name: ticket-router-predictor, namespace: serving}
spec:
  initContainers:
    - name: modelcar-init
      image: kind-registry:5000/ticket-router@sha256:1111111111111111111111111111111111111111111111111111111111111111
  containers:
    - name: kserve-container
      image: kind-registry:5000/smlops-server@sha256:2222222222222222222222222222222222222222222222222222222222222222
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: ["ALL"]}
    - name: modelcar
      image: kind-registry:5000/ticket-router@sha256:1111111111111111111111111111111111111111111111111111111111111111
