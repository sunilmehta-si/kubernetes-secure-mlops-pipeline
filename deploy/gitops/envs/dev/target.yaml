# Where the dev release runs. The ApplicationSet (deploy/gitops/argocd/) makes one Argo CD Application per rendered
# environment from this file; `smlops render-release --env dev` copies it next to the release.
# All three point at the cluster Argo CD runs in; a real setup points each at its own cluster.
env: dev
server: https://kubernetes.default.svc
namespace: serving
project: ml-serving-dev
