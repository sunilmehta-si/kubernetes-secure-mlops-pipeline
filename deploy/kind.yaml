# The local cluster: one kind node, with containerd reading per-registry settings from /etc/containerd/certs.d, as in
# kind's local-registry example (kind v0.33). scripts/cluster-up.sh adds the entry that sends kind-registry:5000 to
# the zot container on the kind network. The node image is pinned in deploy/versions.env.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: smlops
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane
