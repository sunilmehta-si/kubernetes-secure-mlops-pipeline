# Where models are served. Pod Security "restricted" is enforced: no root, no privilege escalation, no host access,
# all capabilities dropped, a seccomp profile. The namespace belongs to the platform (scripts/install-platform.sh);
# releases (smlops render-release, Argo CD) only change what runs inside it.
apiVersion: v1
kind: Namespace
metadata:
  name: serving
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
