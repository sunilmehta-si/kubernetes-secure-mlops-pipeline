# Where models are served. Pod Security "restricted" is enforced: no root, no privilege escalation, no host access,
# all capabilities dropped, a seccomp profile. The service account mounts no Kubernetes API token: a model server
# never needs to talk to the cluster, so a compromised one cannot either.
apiVersion: v1
kind: Namespace
metadata:
  name: serving
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: model-server
  namespace: serving
automountServiceAccountToken: false
