# Network rules for the serving namespace. Everything is denied by default, in and out. The ticket-router predictor
# accepts connections on 8080 only from namespaces labelled smlops.io/model-clients=true (the support tool, and
# Prometheus for /metrics). It gets no egress at all: a model server needs nothing from the network, and a
# compromised one cannot send data out.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: serving
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ticket-router-clients
  namespace: serving
spec:
  podSelector:
    matchLabels:
      serving.kserve.io/inferenceservice: ticket-router
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              smlops.io/model-clients: "true"
      ports:
        - protocol: TCP
          port: 8080
