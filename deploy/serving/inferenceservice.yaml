# The ticket-router endpoint. The model arrives as an OCI image (modelcar) pinned by digest, so what runs is exactly
# what was signed; ${MODEL_IMAGE} is filled in by scripts/deploy-model.sh as registry/repository@sha256:...
# Standard deployment mode (KServe's default since v0.21): a plain Deployment, no Knative or Istio.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: ticket-router
  namespace: serving
spec:
  predictor:
    serviceAccountName: model-server
    minReplicas: 1
    maxReplicas: 2
    model:
      modelFormat:
        name: smlops-bundle
      runtime: smlops-runtime
      storageUri: oci://${MODEL_IMAGE}
