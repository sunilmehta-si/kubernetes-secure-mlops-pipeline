<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="612" viewBox="0 0 1280 612" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">kubernetes-secure-mlops-pipeline: ML system from ingestion to monitoring</title>
<desc id="desc">Six stages from left to right: ingest, prepare, train, evaluate, deploy, monitor. Each lists what this repository uses, marked built or planned, and other tools commonly used for that stage. Built: synthetic ticket ingestion with versioned datasets; a pandera data contract, stratified splits and TF-IDF features; logistic regression trained in Kubeflow Pipelines and tracked in MLflow; metrics, an evaluation gate against the champion and a model card; the MLflow model registry; signed OCI models served by KServe; live drift with Prometheus alerts and a Grafana dashboard; GitOps delivery of one Helm chart to three environments with Argo CD; and retraining when drift is detected, judged by the same gate. GitHub Actions runs CI on every change.</desc>
