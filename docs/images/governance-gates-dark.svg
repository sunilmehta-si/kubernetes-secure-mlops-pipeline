<text x="33" y="42" font-size="22" font-weight="700" fill="#e6edf3" text-anchor="start">Governance: no model ships without evidence</text>
<text x="33" y="64" font-size="13" font-weight="400" fill="#a3adb8" text-anchor="start">Eight gates from idea to retirement. Each asks one question, leaves evidence, has an owner, and is enforced by code wherever possible.</text>
