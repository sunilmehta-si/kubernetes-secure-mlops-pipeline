<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">Governance gates for the ML pipeline</title>
<desc id="desc">Eight gates from idea to retirement. G0 use case and risk, G1 data approval, G2 reproducible training, G3 evaluation gate, G4 release approval, G5 supply chain, G6 deploy admission, G7 operate and retire. Each gate asks one question and lists the checks, the evidence it leaves, its owner and what enforces it, with a status of built, partial or planned.</desc>
