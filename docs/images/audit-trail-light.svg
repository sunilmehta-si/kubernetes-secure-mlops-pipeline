<rect x="33" y="268" width="1214" height="40" rx="12" fill="#f6f6f3" stroke="#dcdad3"/>
<text x="51" y="293" font-size="12" font-weight="500" fill="#57564f" text-anchor="start">Records are made left to right; an audit reads right to left. Today the chain is unbroken from tickets to the registered model; signing and deployment records extend it to production.</text>
</svg>
