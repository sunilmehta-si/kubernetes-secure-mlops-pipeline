<text x="751" y="180" font-size="11" font-weight="500" fill="#57564f" text-anchor="start">signature, ML-BOM</text>
<text x="751" y="208" font-size="10.5" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#57564f">model.sig.json</text>
