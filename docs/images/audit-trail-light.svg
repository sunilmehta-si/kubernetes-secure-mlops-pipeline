<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">Audit trail from a prediction back to its data</title>
<desc id="desc">Seven linked records: tickets with their data contract report, data splits with content fingerprints, the training run with its parameter hash and run id, the model version with its gate decision and model card, then the signed artifact, the deployment and the prediction, which are planned. Each record points to the one before it, so any prediction can be traced back to its data and its approval.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a887f"/></marker></defs>
<rect x="1" y="1" width="1278" height="328" rx="18" fill="#fbfbfa" stroke="#e4e2dc"/>
<text x="33" y="42" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">Audit trail: from any prediction back to its data</text>
<text x="33" y="64" font-size="13" font-weight="400" fill="#57564f" text-anchor="start">Each record links to the one it was made from, so an auditor can ask “which model, trained on what, approved by whom?” and get an answer from records, not memory.</text>
