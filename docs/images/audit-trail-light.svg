<circle cx="229.0" cy="130" r="11" fill="#1a7f37"/>
<text x="229" y="134" font-size="11" font-weight="700" fill="#fbfbfa" text-anchor="middle">2</text>
<text x="247" y="135" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start">Data splits</text>
