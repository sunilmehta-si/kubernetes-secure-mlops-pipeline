<text x="1137" y="42.5" font-size="9.5" font-weight="700" fill="#77756d" text-anchor="middle" letter-spacing="0.5">PLANNED</text>
<rect x="33.0" y="108" width="158.0" height="132" rx="12" fill="#f0f8f2" stroke="#b9dcc4"/>
<circle cx="53.0" cy="130" r="11" fill="#1a7f37"/>
<text x="53" y="134" font-size="11" font-weight="700" fill="#fbfbfa" text-anchor="middle">1</text>
<text x="71" y="135" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start">Tickets</text>
<text x="47" y="164" font-size="9" font-weight="700" fill="#8a887f" text-anchor="start" letter-spacing="0.6">RECORDS</text>
<text x="47" y="180" font-size="11" font-weight="500" fill="#0b0b0b" text-anchor="start">data contract report</text>
<text x="47" y="208" font-size="10.5" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#57564f">schema ok, 20+/team</text>
