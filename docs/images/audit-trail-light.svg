<text x="599" y="135" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start">Model version</text>
<text x="575" y="164" font-size="9" font-weight="700" fill="#8a887f" text-anchor="start" letter-spacing="0.6">RECORDS</text>
