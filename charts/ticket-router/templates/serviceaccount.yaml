# The identity model servers run as. It mounts no Kubernetes API token: a model server never needs to talk to the
# cluster, so a compromised one cannot either.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: model-server
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ticket-router.labels" . | nindent 4 }}
automountServiceAccountToken: false
