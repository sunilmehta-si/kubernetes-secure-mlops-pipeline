[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kubernetes-secure-mlops-pipeline"
description = "An MLOps pipeline on Kubernetes where every model that reaches production is reproducible, evaluated, signed and verified."
readme = "README.md"
license = "MIT"
authors = [{ name = "Sunil Mehta" }]
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "scikit-learn==1.9.1",
    "pandas==3.1.0",
    "pandera==0.34.1",
    "pyyaml==6.0.3",
    "mlflow==3.17.2",
    "kfp==2.17.0",
    "skops==0.16.0",
    "model-signing==1.1.1",
    # model-signing 1.1.1 imports OpenSSL without declaring it; sigstore declared it until 4.5.1 (2026-10-20),
    # so fresh installs broke overnight. Pinned here until model-signing declares it.
    "pyopenssl==26.4.0",
    "cyclonedx-python-lib[json-validation]==11.12.0",
    "fastapi==0.143.3",
    "uvicorn==0.54.0",
    "prometheus-client==0.26.0",
    "requests==2.33.0",            # the load tool's client; the pin matches kfp's own exact pin
]

[project.optional-dependencies]
test = ["httpx==0.28.1"]

[project.scripts]
smlops = "secure_mlops.cli:main"

[tool.setuptools.dynamic]
version = { attr = "secure_mlops.__version__" }

[tool.setuptools.packages.find]
include = ["secure_mlops*"]

[tool.uv]
# The lock (uv.lock) pins every transitive package; CI, the image and the cluster install from it with
# `uv sync --frozen`, and Dependabot updates it with a real resolver, so a bump that another package
# forbids never reaches a pull request.
# kfp 2.17.0 pins urllib3==2.7.0, which has two HIGH CVEs fixed in 2.8.0; the full test suite, KFP executor
# runs included, passes on 2.8.0. Remove the override once kfp relaxes the pin.
override-dependencies = ["urllib3==2.8.0"]
