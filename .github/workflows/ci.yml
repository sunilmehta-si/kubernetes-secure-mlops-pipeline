name: ci

on:
  push:
    branches: [main]
  pull_request:

# `shell: bash` runs steps with -eo pipefail; the default (-e only) lets `script | tee` pass when the script fails.
defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    env:
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install Helm
        run: |
          . deploy/versions.env
          name="helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$name" "https://get.helm.sh/$name"
          echo "86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb  $RUNNER_TEMP/$name" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin" && tar -xzf "$RUNNER_TEMP/$name" -C "$RUNNER_TEMP/bin" --strip-components=1 linux-amd64/helm
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: pip install -c requirements-lock.txt -e ".[test]"
      - name: Nothing outside the lock is installed
        run: |
          pip freeze --exclude kubernetes-secure-mlops-pipeline | tr '[:upper:]' '[:lower:]' | sort > "$RUNNER_TEMP/installed.txt"
          grep -v '^#' requirements-lock.txt | grep . | tr '[:upper:]' '[:lower:]' | sort > "$RUNNER_TEMP/locked.txt"
          comm -23 "$RUNNER_TEMP/installed.txt" "$RUNNER_TEMP/locked.txt" | tee "$RUNNER_TEMP/extra.txt"
          if [ -s "$RUNNER_TEMP/extra.txt" ]; then echo "installed but not in requirements-lock.txt (above)"; exit 1; fi
      - run: python -W error::SyntaxWarning -m unittest discover -s tests -t . -v

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: kubernetes-secure-mlops-pipeline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the pipeline image
        run: docker build -t "$IMAGE:$GITHUB_SHA" .
      - name: Run the CLI inside it as its non-root user
        run: |
          docker run --rm "$IMAGE:$GITHUB_SHA" --version
          test "$(docker run --rm --entrypoint id "$IMAGE:$GITHUB_SHA" -u)" = "10001"
          docker run --rm "$IMAGE:$GITHUB_SHA" data generate --n 1000 -o /tmp/data
      - name: Scan for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  drills:
    # The governance and security controls, run as a user would run them; outputs go to the job summary.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -c requirements-lock.txt -e .
      - name: Sign, verify and request promotion
        run: |
          smlops keys generate -o "$RUNNER_TEMP/keys"
          smlops data generate -o data
          smlops train --data data --signing-key "$RUNNER_TEMP/keys/signing-key.pem" > gate.md
          smlops verify --public-key "$RUNNER_TEMP/keys/signing-key.pub.pem"
          smlops promotion-request -o promotion.md
          { cat gate.md; echo; cat promotion.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: Drift drill (clean batch passes, shifted batch alerts)
        run: |
          smlops data generate --seed 21 -o clean
          smlops data generate --seed 22 --drift 1 -o shifted
          smlops drift --reference data/train.csv --current clean/test.csv >> "$GITHUB_STEP_SUMMARY"
          if smlops drift --reference data/train.csv --current shifted/test.csv > shifted.md; then
            echo "the shifted batch should have raised a drift alert"; exit 1
          fi
          cat shifted.md >> "$GITHUB_STEP_SUMMARY"

  policies:
    # Admission policies tested offline with the Kyverno CLI, downloaded at a pinned version and checked by checksum.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Kyverno CLI
        run: |
          . deploy/versions.env
          name="kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$name" "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/$name"
          echo "b38228f367fc0fdc2b08f4c83ea50ac5f16c60ff8d62d76a66157c33c47b70ae  $RUNNER_TEMP/$name" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$name" -C "$RUNNER_TEMP" kyverno
      - run: $RUNNER_TEMP/kyverno test deploy/policy/tests

  alerts:
    # Alert rules checked and unit-tested with promtool, and Alertmanager routing tested with amtool; both downloaded
    # at pinned versions and checked by checksum.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install promtool
        run: |
          . deploy/versions.env
          name="prometheus-${PROMETHEUS_VERSION#v}.linux-amd64"
          curl -sSfL -o "$RUNNER_TEMP/$name.tar.gz" "https://github.com/prometheus/prometheus/releases/download/${PROMETHEUS_VERSION}/$name.tar.gz"
          echo "2a542df32eac02ee17b9d844fb2aa1de00dafa5476579ba8a3ba862e9d572ea0  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP" --strip-components=1 "$name/promtool"
      - run: $RUNNER_TEMP/promtool check rules deploy/monitoring/alerts.yaml
      - run: $RUNNER_TEMP/promtool test rules deploy/monitoring/tests/alerts-test.yaml
      - name: Install amtool
        run: |
          . deploy/versions.env
          name="alertmanager-${ALERTMANAGER_VERSION#v}.linux-amd64"
          curl -sSfL -o "$RUNNER_TEMP/$name.tar.gz" "https://github.com/prometheus/alertmanager/releases/download/${ALERTMANAGER_VERSION}/$name.tar.gz"
          echo "265b9d1e55ef0d5306a436018af6d2b686c2ce051f03d968f7464ecb1372a7e8  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP" --strip-components=1 "$name/amtool"
      - run: pip install pyyaml==6.0.3
      - run: scripts/test-alert-routing.sh "$RUNNER_TEMP/amtool"

  chart:
    # The ticket-router chart linted strictly in every environment, at the pinned and checksummed Helm.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Helm
        run: |
          . deploy/versions.env
          name="helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$name" "https://get.helm.sh/$name"
          echo "86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb  $RUNNER_TEMP/$name" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$name" -C "$RUNNER_TEMP" --strip-components=1 linux-amd64/helm
      - run: scripts/lint-chart.sh "$RUNNER_TEMP/helm"
