name: code-review

# Reviews every pull request with agentic-code-review-tool: application, infrastructure and AI/ML rules on the
# changed lines, as a PR review with inline comments and as diff annotations. The AI step is off, so no model key
# is needed. Dependabot PRs get a read-only token, so they receive annotations but no review comment.
on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: sunilmehta-si/agentic-code-review-tool@a7e0a2eac4da85c81831eacd2189902ace39d39a # v0.5.0
        with:
          fail-on: high
          ai: none
          scanners: none
          sarif-file: ""
