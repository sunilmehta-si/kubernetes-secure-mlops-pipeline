# Each update waits 14 days after a release, the same age rule the versions report applies to the pins, so a
# compromised or withdrawn release is usually found before it is proposed. Security updates are not delayed.
# Weekly dependency updates. Every update runs the full CI: tests, the image build and its vulnerability scan.
version: 2
updates:
  - package-ecosystem: uv          # updates pyproject.toml and uv.lock together, with a real resolver
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
